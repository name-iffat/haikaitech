<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HaikaiTech / Selected Work / All Visuals</title>
    <style>
      :root { --paper:#fdfbf7; --ink:#16202a; --blue:#1e3a8a; --line:#d7dce2; --mint:#0f9f75; --tape:#f4d35e; --white:#fff; }
      * { box-sizing:border-box; }
      body { margin:0; color:var(--ink); font-family:Inter,Arial,sans-serif; background-color:var(--paper); background-image:radial-gradient(#cbd5e1 1px,transparent 1px); background-size:16px 16px; }
      main { max-width:1440px; margin:0 auto; padding:96px 64px 104px; }
      header { display:grid; grid-template-columns:1.15fr .85fr; gap:72px; padding-bottom:72px; }
      .eyebrow,.meta { margin:0; color:var(--blue); font:500 11px/1.4 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; }
      h1 { max-width:8ch; margin:28px 0 0; font-size:88px; font-weight:700; line-height:.92; letter-spacing:-.065em; }
      .intro { align-self:end; max-width:30ch; margin:0; font-size:20px; line-height:1.45; }
      .work-wall { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:32px 24px; align-items:start; }
      .project { position:relative; margin:0; padding:10px; background:var(--white); border:1px solid var(--line); box-shadow:0 10px 30px rgb(22 32 42 / .08); }
      .project::before { content:''; position:absolute; z-index:2; top:-11px; left:42%; width:76px; height:22px; background:rgb(244 211 94 / .88); transform:rotate(-2deg); }
      .project img { display:block; width:100%; height:auto; }
      figcaption { display:flex; justify-content:space-between; gap:16px; padding:14px 4px 4px; font:500 10px/1.4 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; }
      figcaption span:last-child { color:var(--blue); }
      .project-name { display:block; margin-bottom:4px; color:var(--ink); font:700 18px/1 Inter,Arial,sans-serif; letter-spacing:-.04em; text-transform:none; }
      .status { display:inline-flex; align-items:center; gap:7px; }
      .status::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--mint); }
      .status.demo::before { background:var(--blue); }
      .project a { color:inherit; text-decoration:none; }
      .project--mze { grid-column:span 7; transform:rotate(-.5deg); }
      .project--hss { grid-column:span 5; margin-top:56px; transform:rotate(.65deg); }
      .project--aa { grid-column:span 3; transform:rotate(.35deg); }
      .project--city { grid-column:span 4; margin-top:44px; transform:rotate(-.3deg); }
      .project--kopi { grid-column:span 5; transform:rotate(.45deg); }
      .project--hss::after { content:'real work, in the field'; position:absolute; right:-12px; top:-47px; color:var(--blue); font:24px/1 'Patrick Hand',cursive; transform:rotate(5deg); }
      .project--hss .arrow { position:absolute; right:10px; top:-30px; width:67px; height:42px; color:var(--blue); }
      .archive { display:flex; justify-content:space-between; gap:24px; margin-top:80px; padding-top:24px; border-top:1px solid var(--line); color:var(--blue); font:500 11px/1.5 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; }
      @media (max-width:900px) { main { padding:64px 24px 80px; } header { grid-template-columns:1fr; gap:20px; padding-bottom:56px; } h1 { margin-top:20px; font-size:clamp(52px,15vw,68px); } .intro { font-size:17px; } .work-wall { grid-template-columns:1fr; gap:38px; } .project,.project--mze,.project--hss,.project--aa,.project--city,.project--kopi { grid-column:1; margin-top:0; transform:none; } .project--hss::after,.project--hss .arrow { display:none; } .archive { align-items:flex-start; flex-direction:column; margin-top:56px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">03 / Selected work</p>
          <h1>Useful things.<br />Shipped.</h1>
        </div>
        <p class="intro">Five recent builds, from public-facing sites to an operational system. Each screen is real work, not a placeholder.</p>
      </header>

      <section class="work-wall" aria-label="Five recent HaikaiTech projects">
        <figure class="project project--mze">
          <a href="https://mzdemo.haikaitech.my/"><img src="../src/assets/projects/mze-workforce-demo.png" alt="MZE Worker System dashboard" /></a>
          <figcaption><span><b class="project-name">MZE Worker System</b><span class="status demo">System / Demo</span></span><span>01 / 05</span></figcaption>
        </figure>
        <figure class="project project--hss">
          <a href="https://wirelesscctv.com.my/"><img src="../src/assets/projects/hss-wireless-cctv-desktop.png" alt="HSS Wireless CCTV website" /></a>
          <svg class="arrow" viewBox="0 0 70 56" fill="none" aria-hidden="true"><path d="M4 7c11 3 40 7 55 34m0 0-18-4m18 4-7-17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <figcaption><span><b class="project-name">HSS Wireless CCTV</b><span class="status">Website / Live</span></span><span>02 / 05</span></figcaption>
        </figure>
        <figure class="project project--aa">
          <a href="https://aaburger.haikaitech.my/"><img src="../src/assets/projects/aaburger-kiosk-desktop.png" alt="AA Burger Kiosk ordering interface" /></a>
          <figcaption><span><b class="project-name">AA Burger Kiosk</b><span class="status">Ordering / Live</span></span><span>03 / 05</span></figcaption>
        </figure>
        <figure class="project project--city">
          <a href="https://citythree.my/"><img src="../src/assets/projects/citythree-desktop.png" alt="CityThree website" /></a>
          <figcaption><span><b class="project-name">CityThree</b><span class="status">Website / Live</span></span><span>04 / 05</span></figcaption>
        </figure>
        <figure class="project project--kopi">
          <a href="https://kopitebu-website.pages.dev/"><img src="../src/assets/projects/kopitebu-desktop.png" alt="Kopi Tebu website" /></a>
          <figcaption><span><b class="project-name">Kopi Tebu</b><span class="status">Website / Live</span></span><span>05 / 05</span></figcaption>
        </figure>
      </section>

      <p class="archive"><span>More projects in the workshop archive</span><span>View all work ↘</span></p>
    </main>
  </body>
</html>
