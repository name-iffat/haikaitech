<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HaikaiTech / Workshop Archive Rail</title>
    <style>
      :root { --paper:#fdfbf7; --ink:#16202a; --blue:#1e3a8a; --line:#d7dce2; --mint:#0f9f75; --tape:#f4d35e; --white:#fff; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); font-family:Inter,Arial,sans-serif; background-color:var(--paper); background-image:radial-gradient(#cbd5e1 1px,transparent 1px); background-size:16px 16px; }
      main { max-width:1440px; margin:0 auto; padding:104px 64px 112px; overflow:hidden; }
      .head { display:grid; grid-template-columns:1.1fr .9fr; gap:72px; align-items:end; padding-bottom:56px; }
      .eyebrow,.count,.status { margin:0; color:var(--blue); font:500 11px/1.4 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; }
      h1 { max-width:9ch; margin:24px 0 0; font-size:clamp(58px,6.1vw,82px); line-height:.92; letter-spacing:-.065em; }
      .intro { max-width:31ch; margin:0; font-size:19px; line-height:1.45; }
      .rail-head { display:flex; justify-content:space-between; align-items:center; gap:24px; padding:20px 0; border-top:1px solid var(--line); }
      .rail-title { display:flex; align-items:baseline; gap:16px; }
      .rail-title h2 { margin:0; font-size:23px; letter-spacing:-.04em; }
      .controls { display:flex; gap:8px; }
      button { width:48px; height:48px; border:1px solid var(--line); border-radius:4px; background:var(--white); color:var(--ink); font-size:21px; }
      button[disabled] { color:var(--line); }
      .rail { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(300px, 27vw); gap:24px; overflow-x:auto; overscroll-behavior-inline:contain; scroll-snap-type:inline mandatory; padding:12px 0 32px; scrollbar-color:var(--blue) var(--paper); scrollbar-width:thin; }
      .sheet { position:relative; scroll-snap-align:start; margin:0; padding:9px; border:1px solid var(--line); background:var(--white); box-shadow:0 10px 30px rgb(22 32 42 / .08); }
      .sheet:nth-child(3n+2) { transform:rotate(.4deg); }
      .sheet:nth-child(4n+3) { transform:rotate(-.35deg); }
      .sheet::before { content:''; position:absolute; z-index:2; top:-10px; left:42%; width:66px; height:20px; background:rgb(244 211 94 / .88); transform:rotate(-2deg); }
      .sheet img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; object-position:center; background:var(--paper); }
      .sheet a { display:block; color:inherit; text-decoration:none; }
      figcaption { display:flex; align-items:end; justify-content:space-between; gap:12px; padding:14px 4px 3px; }
      figcaption b { display:block; margin-bottom:5px; font-size:18px; letter-spacing:-.04em; }
      .status { display:inline-flex; align-items:center; gap:7px; font-size:10px; }
      .status::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--mint); }
      .status.demo::before { background:var(--blue); }
      .visit { flex-shrink:0; color:var(--blue); font:500 10px/1.4 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; }
      .hint { display:flex; justify-content:space-between; gap:24px; margin:22px 0 0; color:var(--blue); font:500 10px/1.5 'JetBrains Mono',monospace; letter-spacing:.09em; text-transform:uppercase; }
      .mobile-hint { display:none; }
      @media (max-width:900px) { main { padding:72px 24px 80px; } .head { grid-template-columns:1fr; gap:22px; padding-bottom:44px; } h1 { font-size:clamp(52px,15vw,68px); } .intro { font-size:17px; } .rail-head { align-items:flex-start; } .controls { display:none; } .rail { grid-auto-columns:76vw; gap:18px; padding-top:10px; } .sheet { padding:6px; transform:none !important; } .sheet::before { top:-9px; width:56px; height:18px; } .desktop-hint,.hint span:last-child { display:none; } .mobile-hint { display:inline; } }
    </style>
  </head>
  <body>
    <main>
      <header class="head">
        <div>
          <p class="eyebrow">03.B / Workshop archive</p>
          <h1>The rest of the work.</h1>
        </div>
        <p class="intro">Fifteen more public sites, product studies and demos—kept visual, linked and easy to browse.</p>
      </header>

      <section aria-label="All HaikaiTech project archive">
        <div class="rail-head">
          <div class="rail-title"><h2>Every build, on the wall.</h2><span class="count">15 projects</span></div>
          <div class="controls" aria-label="Archive navigation"><button disabled aria-label="Previous projects">←</button><button aria-label="Next projects">→</button></div>
        </div>
        <div class="rail">
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/avsbina.webp" alt="AVS Design and Construction website" /><figcaption><span><b>AVS Design &amp; Construction</b><small class="status">Website / Live</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/adyumrah.webp" alt="Ady Umrah Hajj website" /><figcaption><span><b>Ady Umrah Hajj</b><small class="status">Website / Live</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/fuzzfloor.webp" alt="Fuzzfloor website" /><figcaption><span><b>Fuzzfloor</b><small class="status">Website / Live</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/atone.webp" alt="AT One Construction website" /><figcaption><span><b>AT One Construction</b><small class="status">Website / Live</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/al-murtajiz-travel.webp" alt="Al Murtajiz Travel website" /><figcaption><span><b>Al Murtajiz Travel</b><small class="status">Website / Live</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/hijrahalharamainhq.webp" alt="Hijrah Umrah website" /><figcaption><span><b>Hijrah Umrah</b><small class="status">Website / Live</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/dentex-clinic.webp" alt="Dentex Clinic demo" /><figcaption><span><b>Dentex Clinic</b><small class="status demo">Website / Demo</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/medin-fragrances.webp" alt="Medin Fragrances website" /><figcaption><span><b>Médin Fragrances</b><small class="status">Shopify / Live</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/clarity-learncentre.webp" alt="Clarity Learn Centre demo" /><figcaption><span><b>Clarity Learn Centre</b><small class="status demo">Website / Demo</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/binamaju.webp" alt="Binamaju Construction demo" /><figcaption><span><b>Binamaju Construction</b><small class="status demo">Website / Demo</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/binapro.webp" alt="BinaPro Contractor Blueprint demo" /><figcaption><span><b>BinaPro</b><small class="status demo">Concept / Demo</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/hawkerrewards.webp" alt="HawkerRewards demo" /><figcaption><span><b>HawkerRewards</b><small class="status demo">Product / Demo</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/bear-split-waitlist.webp" alt="BearSplit Waitlist demo" /><figcaption><span><b>BearSplit Waitlist</b><small class="status demo">Product / Demo</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/rumahpizza.webp" alt="Rumah Pizza demo" /><figcaption><span><b>Rumah Pizza</b><small class="status demo">Website / Demo</small></span><span class="visit">View ↗</span></figcaption></a></figure>
          <figure class="sheet"><a href="#"><img src="../src/assets/projects/tahu-kripto.webp" alt="TahuKripto demo" /><figcaption><span><b>TahuKripto</b><small class="status demo">Product / Demo</small></span><span class="visit">View ↗</span></figcaption></a></figure>
        </div>
        <p class="hint"><span class="desktop-hint">← Drag, trackpad or use arrows to browse</span><span class="mobile-hint">← Swipe across all 15 projects</span><span>Live projects use mint / demos use blueprint</span></p>
      </section>
    </main>
  </body>
</html>
